<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900"><rect width="1400" height="900" fill="#fbfcfa"/><text x="700" y="82" text-anchor="middle" font-size="46" font-weight="bold" fill="#143d50">传染性单核细胞增多症</text><text x="700" y="123" text-anchor="middle" font-size="24" fill="#536b75">通用机制流程 · 不代表本病例实际检查结果</text><rect x="140" y="160" width="1120" height="90" rx="22" fill="#dcefed"/><text x="700" y="217" text-anchor="middle" font-size="31" fill="#143d50">常见病因为EB病毒感染</text><path d="M700 255 v35 m-12 -12 12 12 12 -12" fill="none" stroke="#548b96" stroke-width="5"/><rect x="140" y="305" width="1120" height="90" rx="22" fill="#e7f0f6"/><text x="700" y="362" text-anchor="middle" font-size="31" fill="#143d50">淋巴组织及免疫反应</text><path d="M700 400 v35 m-12 -12 12 12 12 -12" fill="none" stroke="#548b96" stroke-width="5"/><rect x="140" y="450" width="1120" height="90" rx="22" fill="#f9e3d9"/><text x="700" y="507" text-anchor="middle" font-size="31" fill="#143d50">发热、咽部症状、淋巴结变化</text><path d="M700 545 v35 m-12 -12 12 12 12 -12" fill="none" stroke="#548b96" stroke-width="5"/><rect x="140" y="595" width="1120" height="90" rx="22" fill="#ecedf7"/><text x="700" y="652" text-anchor="middle" font-size="31" fill="#143d50">部分病例肝脾受累，评估活动限制</text><text x="700" y="850" text-anchor="middle" font-size="25" fill="#315c6d">AI辅助编制 · 教学示意，非真实患者影像</text></svg>