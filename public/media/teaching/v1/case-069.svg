<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900"><rect width="1400" height="900" fill="#fbfcfa"/><text x="700" y="82" text-anchor="middle" font-size="46" font-weight="bold" fill="#143d50">糖原贮积病</text><text x="700" y="123" text-anchor="middle" font-size="24" fill="#536b75">通用机制流程 · 不代表本病例实际检查结果</text><rect x="140" y="160" width="1120" height="90" rx="22" fill="#dcefed"/><text x="700" y="217" text-anchor="middle" font-size="31" fill="#143d50">糖原合成或分解相关酶异常</text><path d="M700 255 v35 m-12 -12 12 12 12 -12" fill="none" stroke="#548b96" stroke-width="5"/><rect x="140" y="305" width="1120" height="90" rx="22" fill="#e7f0f6"/><text x="700" y="362" text-anchor="middle" font-size="31" fill="#143d50">糖原结构、蓄积或能量动员异常</text><path d="M700 400 v35 m-12 -12 12 12 12 -12" fill="none" stroke="#548b96" stroke-width="5"/><rect x="140" y="450" width="1120" height="90" rx="22" fill="#f9e3d9"/><text x="700" y="507" text-anchor="middle" font-size="31" fill="#143d50">肝脏、肌肉等受累依亚型而异</text><path d="M700 545 v35 m-12 -12 12 12 12 -12" fill="none" stroke="#548b96" stroke-width="5"/><rect x="140" y="595" width="1120" height="90" rx="22" fill="#ecedf7"/><text x="700" y="652" text-anchor="middle" font-size="31" fill="#143d50">结合酶学及分子遗传明确亚型</text><text x="700" y="850" text-anchor="middle" font-size="25" fill="#315c6d">AI辅助编制 · 教学示意，非真实患者影像</text></svg>